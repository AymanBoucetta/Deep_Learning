[project]
name = "deeplearning"
version = "0.1.0"
description = "Exercices de deep learning et de traitement d'images"
readme = "README.md"
authors = [
    { name = "AymanBoucetta" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorflow>=2.20.0",
]

[project.scripts]
deeplearning = "deeplearning:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
